<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="mobile-web-app-capable" content="yes" />
<title>Embroidery Pop-Up</title>
<link rel="manifest" href="manifest.json" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="app">
  <div class="logo-wrap" id="logoWrap"></div>

  <div class="card">
    <div class="steps" id="stepsDots"></div>

    <!-- Step 1: customer info -->
    <section id="step1">
      <h1>Welcome!</h1>
      <p class="subtitle">Let's get started. Please enter your information.</p>
      <div id="fieldsContainer"></div>
      <div class="error-text" id="step1Error"></div>
      <div class="btn-row">
        <button class="btn btn-primary" id="toStep2">Next</button>
      </div>
    </section>

    <!-- Step 2: font selection -->
    <section id="step2" class="hidden">
      <h1>Choose Your Font Style</h1>
      <p class="subtitle">Tap an option below to select it.</p>
      <div class="options-grid" id="optionsGrid"></div>
      <div class="error-text" id="step2Error"></div>
      <div class="btn-row">
        <button class="btn btn-secondary" id="toStep1">Back</button>
        <button class="btn btn-primary" id="toStep3">Next</button>
      </div>
    </section>

    <!-- Step 3: initials -->
    <section id="step3" class="hidden">
      <h1>Your Initials</h1>
      <p class="subtitle" id="initialsHint">Enter up to 3 letters to be embroidered.</p>
      <input type="text" class="initials-input" id="initialsInput" autocomplete="off" autocapitalize="characters" />
      <div class="error-text" id="step3Error"></div>
      <div class="btn-row">
        <button class="btn btn-secondary" id="toStep2b">Back</button>
        <button class="btn btn-primary" id="submitBtn">Enter</button>
      </div>
    </section>

    <!-- Thank you -->
    <section id="stepDone" class="hidden">
      <div class="thankyou">
        <div class="big">✓</div>
        <h1>Thank You!</h1>
        <p class="subtitle">Your order number is:</p>
        <div class="order-number" id="orderNumberDisplay"></div>
        <div class="order-summary" id="orderSummary"></div>
        <div class="btn-row">
          <button class="btn btn-secondary" id="printBtn">Print Order</button>
          <button class="btn btn-primary hidden" id="completeBtn">Complete</button>
        </div>
      </div>
    </section>
  </div>

  <div class="footer-link"><a href="admin.html">staff</a></div>
</div>

<script src="js/db.js"></script>
<script src="js/customer.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
  }
</script>
</body>
</html>
